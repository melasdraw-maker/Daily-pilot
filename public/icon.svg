<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle with squircle radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

  <!-- Compass / Navigation Pilot Needle -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer radar rings -->
    <circle r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="8 8"/>
    <circle r="100" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>
    <circle r="56" fill="rgba(255,255,255,0.08)"/>

    <!-- Compass Cardinal points -->
    <line x1="0" y1="-148" x2="0" y2="-132" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="148" y1="0" x2="132" y2="0" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="148" x2="0" y2="132" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-148" y1="0" x2="-132" y2="0" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Top Arrow (North / Pilot) -->
    <path d="M 0 -120 L 32 -16 L 0 0 Z" fill="#ffffff"/>
    <path d="M 0 -120 L -32 -16 L 0 0 Z" fill="rgba(255,255,255,0.82)"/>

    <!-- Bottom Arrow (Emerald / Mission path) -->
    <path d="M 0 120 L 32 16 L 0 0 Z" fill="url(#accentGrad)"/>
    <path d="M 0 120 L -32 16 L 0 0 Z" fill="#10b981"/>

    <!-- Center Pivot Pin -->
    <circle r="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
    <circle r="6" fill="#06b6d4"/>
  </g>

  <!-- Small Alarm Clock Badge on Top-Right -->
  <g transform="translate(372, 110)">
    <circle r="36" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
    <circle r="26" fill="#ffffff"/>
    <!-- Clock hands at 07:15 -->
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="11" y2="4" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
