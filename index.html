    <script>
      // Immediate Service Worker registration for PWABuilder & Mobile installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function (reg) {
              console.log('Daily Pilot Service Worker registered with scope:', reg.scope);
            })
            .catch(function (err) {
              console.warn('Daily Pilot Service Worker registration failed:', err);
            });
        });
      }
    </script>
    <script>
      // 1. Silent Vite HMR WebSocket dummy for cloud proxy environments (HMR disabled in AI Studio)
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        window.WebSocket = function (url, protocols) {
          var isViteHmr =
            protocols === 'vite-hmr' ||
            (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
            (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1));

          if (isViteHmr) {
            var listeners = {};
            var dummy = {
              readyState: 1, // OPEN
              OPEN: 1,
              CONNECTING: 0,
              CLOSING: 2,
              CLOSED: 3,
              protocol: 'vite-hmr',
              url: url,
              addEventListener: function (type, fn) {
                listeners[type] = listeners[type] || [];
                listeners[type].push(fn);
                if (type === 'open') {
                  setTimeout(function () {
                    try { fn({ type: 'open', target: dummy }); } catch (e) {}
                  }, 0);
                }
              },
              removeEventListener: function (type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function (cb) { return cb !== fn; });
              },
              send: function () {},
              close: function () {
                dummy.readyState = 3;
                if (listeners['close']) {
                  listeners['close'].forEach(function (cb) {
                    try { cb({ type: 'close', wasClean: true, code: 1000, target: dummy }); } catch (e) {}
                  });
                }
              },
            };
            return dummy;
          }

          return new NativeWebSocket(url, protocols);
        };

        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket.OPEN = NativeWebSocket.OPEN;
        window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
        window.WebSocket.CLOSED = NativeWebSocket.CLOSED;

        // 2. Filter benign dev WebSocket messages
        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(String).join(' ');
          if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('[vite] failed to connect to websocket') !== -1) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('error', function (e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('without opened') !== -1)) {
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason ? String(e.reason) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('without opened') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>
